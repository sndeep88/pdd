workflows:
  paddyusdt-ios:
    name: Paddyusdt iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.paddyusdt.paddyusdtApp
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up code signing and provisioning
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          cd mobile_app
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd mobile_app/ios
          pod install
      - name: Build iOS IPA
        script: |
          cd mobile_app
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile_app/build/ios/ipa/*.ipa
      - mobile_app/build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - sndeep@example.com
        notify:
          success: true
          failure: true

  paddyusdt-ios-unsigned:
    name: Paddyusdt iOS Unsigned (free sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd mobile_app
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd mobile_app/ios
          pod install
      - name: Build iOS app without code signing
        script: |
          cd mobile_app
          flutter build ios --release --no-codesign \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
      - name: Package unsigned IPA
        script: |
          cd mobile_app/build/ios/iphoneos
          rm -rf Payload Paddyusdt-unsigned.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qr Paddyusdt-unsigned.ipa Payload
    artifacts:
      - mobile_app/build/ios/iphoneos/Paddyusdt-unsigned.ipa
